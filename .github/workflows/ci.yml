name: CI

# فحص كل فرع وطلب دمج قبل الوصول إلى main: الأنواع + جودة الكود + الاختبارات (ومنها عقد البيانات) + البناء
# + حارس التحميل الأولي (مكتبات الرسم لا تُجلب مع الصفحة الأولى).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
