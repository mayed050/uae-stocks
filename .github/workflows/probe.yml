name: Probe data sources (temporary)
on:
  push:
    branches: [probe/financials]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Probe
        run: node scripts/probe-dfm.mjs 2>probe-err.txt || true
      # النتائج تُلتزم على فرع الفحص نفسه لقراءتها كاملة (دفع GITHUB_TOKEN لا يُطلق سير عمل جديدًا)
      - name: Commit results
        run: |
          mkdir -p probe-out && cp probe-err.txt probe-out/ || true
          git config user.name "probe-bot"
          git config user.email "actions@github.com"
          git add probe-out
          git commit -m "probe: نتائج الفحص" && git push || echo "no results"
