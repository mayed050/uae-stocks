name: Probe data sources (temporary)
on:
  push:
    branches: [probe/data-sources]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        run: |
          node scripts/probe-sources.mjs > probe.txt 2>&1 || true
          # النتيجة كملاحظات (annotations) مقسّمة لقراءتها عبر واجهة GitHub البرمجية
          split -l 25 probe.txt part_
          for f in part_*; do
            body=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=probe-$f::$body"
          done
