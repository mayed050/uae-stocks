name: Update market data

# يحدّث أسعار السوقين يوميًا بعد الإغلاق ثم يدفع التغيير،
# فيُعاد بناء الموقع ونشره على GitHub Pages عبر مُشغّل workflow_run في deploy.yml.

on:
  schedule:
    # 12:00 UTC = 16:00 بتوقيت دبي (بعد إغلاق الجلسة)، أيام الإثنين–الجمعة.
    - cron: '0 12 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # الاعتماديات لازمة لحارس البيانات (Zod + Vitest) أدناه
      - name: Install dependencies
        run: npm ci

      - name: Fetch latest prices
        run: node scripts/update-data.mjs

      - name: Fetch price history (DFM)
        run: node scripts/fetch-history.mjs || echo "history fetch failed (non-fatal)"

      # حارس البيانات: يرفض أي ملف بيانات يخالف العقد (src/data/schema.ts) قبل دفعه؛
      # عند الفشل لا يُدفع شيء، ويفتح تنبيه الفشل أدناه Issue تلقائيًا.
      - name: Validate data contract
        run: npx vitest run src/__tests__/data.test.ts

      - name: Commit & push if changed
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add public/data.json src/data/seed.json public/history.json
          if git diff --staged --quiet; then
            echo "لا تغييرات في البيانات."
          else
            git commit -m "chore(data): تحديث أسعار يومي"
            git push
          fi

      # مراجعة بشرية: توزيعات أُضيفت آليًا، وتعارضات بين المصادر، وأسعار متقادمة — في Issue واحد يُحدَّث
      # يوميًا ويُغلق تلقائيًا حين لا يبقى ما يُراجع. على main فقط (التشغيل التجريبي على فرع لا يمسّ Issues).
      - name: Publish review issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔎 مراجعة البيانات الآلية"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -s review.md ]; then
            { echo "آخر تحديث: $(date -u +%F) — القيم الآلية تظهر في الموقع بعلامة «يلزم التحقق»."; echo; cat review.md; } > review-body.md
            if [ -n "$existing" ]; then gh issue edit "$existing" --body-file review-body.md || true
            else gh issue create --title "$title" --body-file review-body.md || true; fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "لا بنود للمراجعة في تحديث $(date -u +%F)." || true
          fi

      - name: Show review (non-main runs)
        if: github.ref != 'refs/heads/main'
        run: |
          [ -s review.md ] || { echo "لا بنود للمراجعة"; exit 0; }
          split -l 30 review.md review_part_
          for f in review_part_*; do
            echo "::notice title=review-$f::$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')"
          done

      # تنبيه عند فشل الجلب: يفتح Issue واحدًا (أو يعلّق على القائم) بدل التجاهل الصامت.
      - name: Alert on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="⚠️ فشل تحديث بيانات السوق اليومي"
          body="فشل سير عمل \"Update market data\" بتاريخ $(date -u +%F). راجع السجل: $RUN_URL"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || true
          else
            gh issue create --title "$title" --body "$body" || true
          fi
